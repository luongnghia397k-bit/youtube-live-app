name: Extract and Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip Web project (Safe Exclude)
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          # Giải nén tự động ghi đè và bảo vệ tệp index.html không bị đè mất
          unzip -o *.zip -d . -x index.html
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Extract Android Code from Web project
      run: npx tsx generate-android.ts

    - name: Patch Kotlin files directly with Python
      run: |
        cat << 'EOF' > patch.py
        import os
        import re

        for root, dirs, files in os.walk('.'):
            for file in files:
                if file == 'RtmpStreamService.kt':
                    path = os.path.join(root, file)
                    print('=== Tiến hành vá lỗi file bằng Regex:', path)
                    with open(path, 'r', encoding='utf-8') as f:
                        content = f.read()
                    
                    # Sửa lỗi mất dấu gạch chéo ngược quanh $videoInput và $fullDestination
                    content = content.replace('val ffmpegCmd = "-re $loopFlag -i "$videoInput" -c:v copy -c:a aac -f flv "$fullDestination""', 'val ffmpegCmd = "-re $loopFlag -i \\"$videoInput\\" -c:v copy -c:a aac -f flv \\"$fullDestination\\""')

                    # Sử dụng Regex để quét và ghi đè toàn bộ dòng chứa biến lỗi
                    content = re.sub(r'.*log\.message.*', '                Log.d(TAG, "FFmpeg Log: ${log.message}")', content)
                    content = re.sub(r'.*(statistics\.videoFrameNumber|statistics\.bitrate).*', '                Log.d(TAG, "FFmpeg Stats - Frame: ${statistics.videoFrameNumber}, Bitrate: ${statistics.bitrate} kbps")', content)

                    with open(path, 'w', encoding='utf-8') as f:
                        f.write(content)
        print("=== Đã thực thi bản vá lỗi bằng Regex thành công ===")
        EOF
        python3 patch.py

    - name: Patch MainActivity and AndroidManifest with Linux Bash (sed)
      run: |
        echo "=== Sửa lỗi YTLiveTheme trong MainActivity.kt ==="
        find . -name "MainActivity.kt" -exec sed -i 's/import com.ytlive.rtmpstreamer.ui.theme.YTLiveTheme//g' {} +
        find . -name "MainActivity.kt" -exec sed -i 's/YTLiveTheme/MaterialTheme/g' {} +
        
        echo "=== Sửa lỗi AndroidManifest.xml (Icon & Theme) ==="
        find . -name "AndroidManifest.xml" -exec sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' {} +
        find . -name "AndroidManifest.xml" -exec sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' {} +
        find . -name "AndroidManifest.xml" -exec sed -i 's/@style\/Theme\.YTLiveStreamer/@android:style\/Theme.DeviceDefault.NoActionBar/g' {} +

    - name: Print MainActivity.kt last 40 lines for verification
      run: |
        echo "=== KIỂM TRA ĐUÔI TỆP MAINACTIVITY ==="
        find . -name "MainActivity.kt" -exec tail -n 40 {} \;

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    - name: Build Android App with Gradle (Force Clean)
      run: |
        ./gradlew clean assembleDebug --no-build-cache --no-daemon

    - name: Collect APK
      run: |
        mkdir -p build-out
        find . -name "*-debug.apk" -exec cp {} build-out/ \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build-out/*.apk
