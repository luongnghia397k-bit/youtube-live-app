name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          unzip *.zip -d .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name gradlew)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR_PATH=$(dirname "$GRADLEW_PATH")
          cd "$DIR_PATH"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Error: gradlew not found! Please make sure you have uploaded the project .zip file to the repository."
          exit 1
        fi

    - name: Collect APK
      run: |
        mkdir -p build-out
        find . -name "*-debug.apk" -exec cp {} build-out/ \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build-out/*.apk
